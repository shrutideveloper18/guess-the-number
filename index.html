<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" , content="width=device-width,initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <div class="box">
            <h1>Beat the Computer! Guess the Number</h1>
            <input type="number" min="1" max="100" placeholder="Enter a number from 1-100" id="num">
            <button onclick="checknumber()">CHECK</button>
            <p id="result"></p>
            <button id="replayBtn" onclick="replay()" style="display:none; margin-top:15px;">Replay</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
